<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .forge-eye {
      transform-box: fill-box;
      transform-origin: center;
    }
  </style>

  <!-- ORIGINAL BODY/ANTENNA GEOMETRY, unchanged -->
  <rect x="22.5" y="4" width="3" height="6" rx="1.5" fill="#FF8A00"/>
  <circle cx="24" cy="4" r="2.5" fill="#FF8A00"/>
  <path d="M24 8 C13.507 8 5 16.507 5 27 C5 37.493 13.507 46 24 46 C29.233 46 33.975 43.884 37.412 40.462 L43 42 L41.184 36.696 C42.986 33.874 44 30.547 44 27 C44 16.507 35.493 8 24 8Z" fill="#FF8A00"/>

  <!-- thinking eyes -->
  <g transform="rotate(-10 15.5 20)">
    <rect class="forge-eye" x="15.5" y="20" width="5.5" height="10" rx="2.75" fill="white"/>
  </g>
  <g transform="rotate(-24 27.5 19)">
    <rect class="forge-eye" x="27.5" y="19" width="5.5" height="10" rx="2.75" fill="white"/>
  </g>

  <!-- v17: completely new, detached thinking hand under the chin -->
  <!-- palm -->
  <path d="
    M13.0 40.0
    C13.0 37.8 14.8 36.0 17.0 36.0
    C19.2 36.0 21.0 37.8 21.0 40.0
    V41.1
    C21.0 43.3 19.2 45.0 17.0 45.0
    C14.8 45.0 13.0 43.3 13.0 41.1
    Z" fill="white"/>

  <!-- raised index finger: vertical and clearly separate from face -->
  <rect x="18.2" y="30.2" width="3.2" height="10.2" rx="1.6"
        transform="rotate(18 19.8 35.3)" fill="white"/>

  <!-- thumb extending right -->
  <rect x="18.3" y="38.0" width="7.4" height="3.1" rx="1.55"
        transform="rotate(-18 22 39.55)" fill="white"/>

  <!-- finger separation cuts so it reads as a hand -->
  <path d="M14.0 39.0 C14.8 39.4 15.4 40.1 15.6 41.0" stroke="#FF8A00" stroke-width="0.75" stroke-linecap="round"/>
  <path d="M15.5 38.1 C16.3 38.6 16.8 39.3 17.0 40.2" stroke="#FF8A00" stroke-width="0.75" stroke-linecap="round"/>
</svg>