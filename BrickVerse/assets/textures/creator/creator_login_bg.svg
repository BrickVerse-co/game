      <stop offset="1" stop-color="#0c0e13"/>
    </linearGradient>

    <radialGradient id="leftGlow" cx="0.02" cy="0.94" r="0.72">
      <stop offset="0" stop-color="#4d8dff" stop-opacity="0.72"/>
      <stop offset="0.26" stop-color="#2f6dde" stop-opacity="0.34"/>
      <stop offset="0.62" stop-color="#173665" stop-opacity="0.08"/>
