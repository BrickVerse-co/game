      <stop offset="0.28" stop-color="#2e69d9" stop-opacity="0.34"/>
      <stop offset="0.67" stop-color="#17325e" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#101116" stop-opacity="0"/>
