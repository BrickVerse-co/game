name: "Release checks"
on:
  pull_request:
    branches:
      - main
    paths:
      - "BrickVerse/**"
      - "BrickVerse.SourceGen/**"
      - "global.json"
      - ".github/workflows/export-checks.yml"
  workflow_dispatch:

concurrency:
  group: export-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.0
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  release-export-check:
    name: Release Export check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          lfs: true
          submodules: recursive
      - name: .NET Installation
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: false
          cache: true
      - name: Test Build Project
        run: |
          dotnet --version
          godot --version
          cd BrickVerse
          dotnet restore
          godot --headless --verbose --build-solutions --quit
          dotnet build -c ExportRelease
