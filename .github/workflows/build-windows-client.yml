name: Build Windows Client

on:
  workflow_dispatch:
  push:
    branches: [main, beta]

env:
  GODOT_VERSION: 4.7-stable
  PROJECT_DIR: BrickVerse
  APP: client
  EXPORT_PRESET: Client Windows
  BUILD_NAME: BrickVerse
  ZIP_NAME: BrickVerse-Windows.zip
  ARTIFACT_NAME: brickverse-client-windows
  BLOB_PREFIX: binaries/client/windows

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install Godot .NET
        run: |
          wget https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_mono_linux_x86_64.zip
          unzip Godot_v${{ env.GODOT_VERSION }}_mono_linux_x86_64.zip
          sudo mv Godot_v${{ env.GODOT_VERSION }}_mono_linux_x86_64/Godot_v${{ env.GODOT_VERSION }}_mono_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Build C#
        run: |
          dotnet restore "${{ github.workspace }}/${{ env.PROJECT_DIR }}/BrickVerse.csproj"
          dotnet build "${{ github.workspace }}/${{ env.PROJECT_DIR }}/BrickVerse.csproj" -c Release --no-restore

      - name: Import Godot Assets
        run: |
          cd "${{ github.workspace }}/${{ env.PROJECT_DIR }}"
          godot --headless --editor --quit

      - name: Export Windows
        run: |
          mkdir -p "${{ github.workspace }}/dist/windows"
          cd "${{ github.workspace }}/${{ env.PROJECT_DIR }}"
          godot --headless --export-release "${{ env.EXPORT_PRESET }}" "${{ github.workspace }}/dist/windows/${{ env.BUILD_NAME }}.exe"

      - name: Package
        run: |
          cd "${{ github.workspace }}/dist/windows"
          zip -r "../${{ env.ZIP_NAME }}" .

      - name: Hash
        id: hash
        run: |
          EXE_SHA=$(sha256sum "${{ github.workspace }}/dist/windows/${{ env.BUILD_NAME }}.exe" | awk '{print $1}')
          MANAGED_SHA=$(find "${{ github.workspace }}/dist/windows" -type f \( -name "*.dll" -o -name "*.pck" \) -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')

          echo "exe_sha=$EXE_SHA" >> $GITHUB_OUTPUT
          echo "managed_sha=$MANAGED_SHA" >> $GITHUB_OUTPUT

      - name: Upload to Azure Blob
        uses: azure/CLI@v2
        with:
          inlineScript: |
            VERSION="${{ github.ref_name }}-${{ github.run_number }}"
            BLOB_PATH="${{ env.BLOB_PREFIX }}/${{ github.ref_name }}/$VERSION/${{ env.ZIP_NAME }}"

            az storage blob upload \
              --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
              --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
              --container-name "${{ secrets.AZURE_STORAGE_CONTAINER }}" \
              --name "$BLOB_PATH" \
              --file "${{ github.workspace }}/dist/${{ env.ZIP_NAME }}" \
              --content-type "application/zip" \
              --overwrite true

            echo "VERSION=$VERSION" >> $GITHUB_ENV
            echo "FILE_URL=https://${{ secrets.AZURE_STORAGE_ACCOUNT }}.blob.core.windows.net/${{ secrets.AZURE_STORAGE_CONTAINER }}/$BLOB_PATH" >> $GITHUB_ENV

      - name: Register Binary
        run: |
          curl -f -X POST "${{ secrets.BRICKVERSE_API_URL }}/api/v3/binaries/register" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.GH_WORKFLOW_SECRET }}" \
            -d '{
              "branch": "${{ github.ref_name }}",
              "app": "${{ env.APP }}",
              "version": "${{ env.VERSION }}",
              "buildNumber": ${{ github.run_number }},
              "windows": "${{ env.FILE_URL }}",
              "windowsExecutableSha256": "${{ steps.hash.outputs.exe_sha }}",
              "windowsManagedSha256": "${{ steps.hash.outputs.managed_sha }}"
            }'

      - name: Notify Discord
        if: success()
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_RELEASES }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "Windows Client Released",
                "description": "**Version:** `${{ env.VERSION }}`\n**Branch:** `${{ github.ref_name }}`\n**Build:** `${{ github.run_number }}`\n**Download:** ${{ env.FILE_URL }}",
                "color": 5814783
              }]
            }'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ github.workspace }}/dist/${{ env.ZIP_NAME }}