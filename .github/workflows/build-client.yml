name: Build Client

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - beta

permissions:
  contents: read

concurrency:
  group: build-client-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7-stable
  GODOT_TEMPLATE_VERSION: 4.7.stable.mono
  DOTNET_VERSION: 10.0.x
  PROJECT_DIR: BrickVerse
  PROJECT_FILE: BrickVerse/BrickVerse.csproj
  APP: client
  BUILD_DISPLAY_NAME: Client
  RELEASE_CHANNEL: ${{ github.ref_name == 'beta' && 'beta' || 'prod' }}

jobs:
  build-client:
    name: Build Client (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2022
            export_preset: "Client Windows"
            export_file: "BrickVerse.exe"
            package_name: "BrickVerse-Windows.zip"
            artifact_name: "brickverse-client-windows"
            executable_glob: "*.exe"

          - platform: linux
            runner: ubuntu-latest
            export_preset: "Client Linux"
            export_file: "BrickVerse.x86_64"
            package_name: "BrickVerse-Linux.zip"
            artifact_name: "brickverse-client-linux"
            executable_glob: "*.x86_64"

          - platform: macos
            runner: ubuntu-latest
            export_preset: "Client macOS"
            export_file: "BrickVerse-macOS.zip"
            package_name: "BrickVerse-macOS.zip"
            artifact_name: "brickverse-client-macos"
            executable_glob: "*.app"

    steps:
      - name: Checkout BrickVerse
        uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 1
          submodules: recursive

      - name: Verify Git LFS assets
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_VOXEL_FILES=(
            "BrickVerse/addons/zylann.voxel/bin/libvoxel.linux.editor.x86_64.so"
            "BrickVerse/addons/zylann.voxel/bin/libvoxel.windows.template_release.x86_64.dll"
          )

          missing=0
          for file in "${REQUIRED_VOXEL_FILES[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Required Git LFS asset is missing or empty: $file"
              missing=1
            else
              echo "Found LFS asset: $file ($(stat -c%s "$file") bytes)"
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "::error::Git LFS assets were not downloaded. Check that the voxel binaries are committed with Git LFS."
            exit 1
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "${{ env.DOTNET_VERSION }}"

      - name: Stamp client build metadata
        shell: pwsh
        run: |
          $projectSettings = "${{ github.workspace }}\${{ env.PROJECT_DIR }}\project.godot"
          $channel = "${{ env.RELEASE_CHANNEL }}"
          $version = "$channel-${{ github.run_number }}"
          $content = Get-Content -LiteralPath $projectSettings -Raw
          $content = $content -replace '(?m)^build/channel="[^"]*"$', "build/channel=`"$channel`""
          $content = $content -replace '(?m)^build/version="[^"]*"$', "build/version=`"$version`""
          Set-Content -LiteralPath $projectSettings -Value $content -Encoding utf8NoBOM
          Write-Host "Stamped BrickVerse client $version ($channel)"

      - name: Restore NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('BrickVerse/**/*.csproj', 'BrickVerse.SourceGen/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore Godot cache
        if: matrix.platform != 'windows'
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/godot-editor
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_VERSION }}
          key: godot-linux-${{ env.GODOT_VERSION }}-${{ env.GODOT_TEMPLATE_VERSION }}

      - name: Install Godot .NET
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail

          GODOT_DIR="${{ runner.temp }}/godot-editor"
          GODOT_BINARY="$(find "$GODOT_DIR" -type f -name 'Godot_*_mono_linux.x86_64' -print -quit 2>/dev/null || true)"
          if [[ -z "$GODOT_BINARY" ]]; then
            GODOT_ARCHIVE="${{ runner.temp }}/godot.zip"
            GODOT_URL="https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_mono_linux_x86_64.zip"
            rm -rf "$GODOT_DIR"
            mkdir -p "$GODOT_DIR"
            curl --fail --location --retry 3 --output "$GODOT_ARCHIVE" "$GODOT_URL"
            unzip -q "$GODOT_ARCHIVE" -d "$GODOT_DIR"
            GODOT_BINARY="$(find "$GODOT_DIR" -type f -name 'Godot_*_mono_linux.x86_64' -print -quit)"
          fi
          if [[ -z "$GODOT_BINARY" ]]; then
            echo "::error::Could not locate the Godot .NET executable."
            exit 1
          fi

          chmod +x "$GODOT_BINARY"
          ln -sf "$GODOT_BINARY" "${{ runner.temp }}/godot"
          echo "${{ runner.temp }}" >> "$GITHUB_PATH"

          "$GODOT_BINARY" --version

      - name: Install Godot export templates
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_VERSION }}"
          if [[ ! -f "$TEMPLATE_DIR/linux_release.x86_64" ]]; then
            TEMPLATE_ARCHIVE="${{ runner.temp }}/godot-templates.tpz"
            TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_mono_export_templates.tpz"
            TEMPLATE_EXTRACT="${{ runner.temp }}/godot-templates"
            rm -rf "$TEMPLATE_EXTRACT"
            mkdir -p "$TEMPLATE_EXTRACT" "$TEMPLATE_DIR"
            curl --fail --location --retry 3 --output "$TEMPLATE_ARCHIVE" "$TEMPLATE_URL"
            unzip -q "$TEMPLATE_ARCHIVE" -d "$TEMPLATE_EXTRACT"
            cp -a "$TEMPLATE_EXTRACT/templates/." "$TEMPLATE_DIR/"
          fi

      - name: Build C#
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore "${{ github.workspace }}/${{ env.PROJECT_FILE }}"
          dotnet build "${{ github.workspace }}/${{ env.PROJECT_FILE }}" \
            --configuration Release \
            --no-restore

      - name: Import Godot assets
        if: matrix.platform != 'windows'
        shell: bash
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          godot --headless --editor --import

      - name: Export ${{ matrix.platform }}
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail

          EXPORT_DIR="${{ github.workspace }}/dist/${{ matrix.platform }}"
          RAW_DIR="${{ github.workspace }}/dist/raw-${{ matrix.platform }}"
          mkdir -p "$EXPORT_DIR" "$RAW_DIR"

          cd "${{ github.workspace }}/${{ env.PROJECT_DIR }}"

          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            godot --headless --export-release \
              "${{ matrix.export_preset }}" \
              "$RAW_DIR/${{ matrix.export_file }}"

            unzip -q "$RAW_DIR/${{ matrix.export_file }}" -d "$EXPORT_DIR"
          else
            godot --headless --export-release \
              "${{ matrix.export_preset }}" \
              "$EXPORT_DIR/${{ matrix.export_file }}"
          fi

      - name: Validate export
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail

          EXPORT_DIR="${{ github.workspace }}/dist/${{ matrix.platform }}"

          if [[ ! -d "$EXPORT_DIR" ]] || [[ -z "$(find "$EXPORT_DIR" -mindepth 1 -print -quit)" ]]; then
            echo "::error::Export directory is empty."
            exit 1
          fi

          echo "Export contents:"
          find "$EXPORT_DIR" -maxdepth 3 -type f -print | sort

      - name: Restore Windows Godot cache
        if: matrix.platform == 'windows'
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/godot
            ~/AppData/Roaming/Godot/export_templates/${{ env.GODOT_TEMPLATE_VERSION }}
          key: godot-windows-${{ env.GODOT_VERSION }}-${{ env.GODOT_TEMPLATE_VERSION }}

      - name: Export Windows
        if: matrix.platform == 'windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          .github/scripts/export-windows.ps1 `
            -GodotVersion "${{ env.GODOT_VERSION }}" `
            -TemplateVersion "${{ env.GODOT_TEMPLATE_VERSION }}" `
            -ProjectDirectory "${{ github.workspace }}\${{ env.PROJECT_DIR }}" `
            -ProjectFile "${{ github.workspace }}\${{ env.PROJECT_FILE }}" `
            -ExportDirectory "${{ github.workspace }}\dist\windows" `
            -ExportPreset "${{ matrix.export_preset }}" `
            -ExportFile "${{ matrix.export_file }}"


      - name: Azure login
        if: matrix.platform == 'windows'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows client
        if: matrix.platform == 'windows'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE_NAME }}
          files: ${{ github.workspace }}\dist\windows\BrickVerse.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: BrickVerse Client
          description-url: https://brickverse.gg

      - name: Verify Windows client signature
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $file = "${{ github.workspace }}\dist\windows\BrickVerse.exe"
          if (-not (Test-Path -LiteralPath $file)) {
            throw "Signed client executable was not found: $file"
          }

          $signature = Get-AuthenticodeSignature -FilePath $file
          Write-Host "File: $file"
          Write-Host "Status: $($signature.Status)"
          Write-Host "Signer: $($signature.SignerCertificate.Subject)"

          if ($signature.Status -ne "Valid") {
            throw "Windows client signature is invalid: $($signature.Status)"
          }

      - name: Package signed Windows client
        if: matrix.platform == 'windows'
        id: release
        shell: pwsh
        run: |
          $exportDirectory = "${{ github.workspace }}\dist\windows"
          $packagePath = "${{ github.workspace }}\dist\BrickVerse-Windows.zip"
          if (Test-Path -LiteralPath $packagePath) { Remove-Item -LiteralPath $packagePath -Force }
          Push-Location $exportDirectory
          try {
            tar.exe -a -c -f $packagePath *
            if ($LASTEXITCODE -ne 0) { throw "Packaging failed with exit code $LASTEXITCODE." }
          }
          finally {
            Pop-Location
          }

          $packageSha = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $executableSha = (Get-FileHash -LiteralPath "$exportDirectory\BrickVerse.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $managedFile = Get-ChildItem -LiteralPath $exportDirectory -Recurse -File -Filter 'BrickVerse.dll' |
            Select-Object -First 1
          if (-not $managedFile) { throw "Exported BrickVerse.dll was not found." }
          $managedSha = (Get-FileHash -LiteralPath $managedFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()

          $version = "${{ env.RELEASE_CHANNEL }}-${{ github.run_number }}"
          $blobPath = "binaries/${{ env.APP }}/windows/${{ env.RELEASE_CHANNEL }}/$version/BrickVerse-Windows.zip"
          $fileUrl = "https://${{ secrets.AZURE_STORAGE_ACCOUNT }}.blob.core.windows.net/${{ secrets.AZURE_STORAGE_CONTAINER }}/$blobPath"
          "package_sha=$packageSha" >> $env:GITHUB_OUTPUT
          "executable_sha=$executableSha" >> $env:GITHUB_OUTPUT
          "managed_sha=$managedSha" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "blob_path=$blobPath" >> $env:GITHUB_OUTPUT
          "file_url=$fileUrl" >> $env:GITHUB_OUTPUT

      - name: Upload to Azure Blob
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          az storage blob upload `
            --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" `
            --account-key "${{ secrets.AZURE_STORAGE_KEY }}" `
            --container-name "${{ secrets.AZURE_STORAGE_CONTAINER }}" `
            --name "${{ steps.release.outputs.blob_path }}" `
            --file "${{ github.workspace }}\dist\BrickVerse-Windows.zip" `
            --content-type "application/zip" `
            --overwrite true
          if ($LASTEXITCODE -ne 0) { throw "Azure upload failed with exit code $LASTEXITCODE." }

      - name: Register binary
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $payload = [ordered]@{
            branch = "${{ env.RELEASE_CHANNEL }}"
            app = "${{ env.APP }}"
            version = "${{ steps.release.outputs.version }}"
            buildNumber = [int]"${{ github.run_number }}"
            windows = "${{ steps.release.outputs.file_url }}"
            windowsExecutableSha256 = "${{ steps.release.outputs.executable_sha }}"
            windowsManagedSha256 = "${{ steps.release.outputs.managed_sha }}"
            windowsPackageSha256 = "${{ steps.release.outputs.package_sha }}"
          }
          $payload | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath registration.json -Encoding utf8NoBOM
          curl.exe --fail-with-body --request POST `
            "${{ secrets.BRICKVERSE_API_URL }}/api/v3/binaries/register" `
            --header "Content-Type: application/json" `
            --header "Authorization: Bearer ${{ secrets.GH_WORKFLOW_SECRET }}" `
            --data-binary "@registration.json"
          if ($LASTEXITCODE -ne 0) { throw "Binary registration failed with exit code $LASTEXITCODE." }

      - name: Notify Discord
        if: success() && matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $branch = "${{ env.RELEASE_CHANNEL }}"
          $build = "${{ github.run_number }}"
          $download = "${{ steps.release.outputs.file_url }}"
          $description = "**Version:** ``$version``" + "`n" +
            "**Branch:** ``$branch``" + "`n" +
            "**Build:** ``$build``" + "`n" +
            "**Download:** $download"
          @{ embeds = @(@{ title = "windows ${{ env.BUILD_DISPLAY_NAME }} Released"; description = $description; color = 5814783 }) } |
            ConvertTo-Json -Depth 5 | Set-Content -LiteralPath discord.json -Encoding utf8NoBOM
          curl.exe --fail-with-body --request POST "${{ secrets.DISCORD_WEBHOOK_RELEASES }}" `
            --header "Content-Type: application/json" --data-binary "@discord.json"
          if ($LASTEXITCODE -ne 0) { throw "Discord notification failed with exit code $LASTEXITCODE." }

      - name: Upload workflow artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: brickverse-client-windows
          path: ${{ github.workspace }}\dist\BrickVerse-Windows.zip
          if-no-files-found: error
          retention-days: 14

      - name: Package
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail

          EXPORT_DIR="${{ github.workspace }}/dist/${{ matrix.platform }}"
          PACKAGE_PATH="${{ github.workspace }}/dist/${{ matrix.package_name }}"

          rm -f "$PACKAGE_PATH"
          cd "$EXPORT_DIR"
          zip -r -q "$PACKAGE_PATH" .

      - name: Calculate hashes
        if: matrix.platform != 'windows'
        id: hash
        shell: bash
        run: |
          set -euo pipefail

          EXPORT_DIR="${{ github.workspace }}/dist/${{ matrix.platform }}"
          PACKAGE_PATH="${{ github.workspace }}/dist/${{ matrix.package_name }}"

          PACKAGE_SHA="$(sha256sum "$PACKAGE_PATH" | awk '{print $1}')"

          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            # macOS exports put the executable inside the .app bundle.
            PRIMARY_FILE="$(find "$EXPORT_DIR" -type f -path "*/Contents/MacOS/*" | sort | head -n 1 || true)"
          else
            PRIMARY_FILE="$(find "$EXPORT_DIR" -maxdepth 2 -type f \
              \( -name "${{ matrix.executable_glob }}" -o -name "*.pck" \) \
              | sort | head -n 1 || true)"
          fi

          if [[ -n "$PRIMARY_FILE" ]]; then
            EXECUTABLE_SHA="$(sha256sum "$PRIMARY_FILE" | awk '{print $1}')"
          else
            EXECUTABLE_SHA=""
          fi

          MANAGED_FILE="$(find "$EXPORT_DIR" -type f -name 'BrickVerse.dll' -print -quit)"
          if [[ -z "$MANAGED_FILE" ]]; then
            echo "::error::Exported BrickVerse.dll was not found."
            exit 1
          fi
          MANAGED_SHA="$(sha256sum "$MANAGED_FILE" | awk '{print $1}')"

          echo "package_sha=$PACKAGE_SHA" >> "$GITHUB_OUTPUT"
          echo "executable_sha=$EXECUTABLE_SHA" >> "$GITHUB_OUTPUT"
          echo "managed_sha=$MANAGED_SHA" >> "$GITHUB_OUTPUT"

      - name: Prepare release metadata
        if: matrix.platform != 'windows'
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ env.RELEASE_CHANNEL }}-${{ github.run_number }}"
          BLOB_PATH="binaries/${{ env.APP }}/${{ matrix.platform }}/${{ env.RELEASE_CHANNEL }}/$VERSION/${{ matrix.package_name }}"
          FILE_URL="https://${{ secrets.AZURE_STORAGE_ACCOUNT }}.blob.core.windows.net/${{ secrets.AZURE_STORAGE_CONTAINER }}/$BLOB_PATH"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "blob_path=$BLOB_PATH" >> "$GITHUB_OUTPUT"
          echo "file_url=$FILE_URL" >> "$GITHUB_OUTPUT"

      - name: Upload to Azure Blob
        if: matrix.platform != 'windows'
        uses: azure/CLI@v2
        with:
          inlineScript: |
            set -euo pipefail

            az storage blob upload \
              --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
              --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
              --container-name "${{ secrets.AZURE_STORAGE_CONTAINER }}" \
              --name "${{ steps.metadata.outputs.blob_path }}" \
              --file "${{ github.workspace }}/dist/${{ matrix.package_name }}" \
              --content-type "application/zip" \
              --overwrite true

      - name: Register binary
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail

          PLATFORM="${{ matrix.platform }}"

          jq -n \
            --arg branch "${{ env.RELEASE_CHANNEL }}" \
            --arg app "${{ env.APP }}" \
            --arg version "${{ steps.metadata.outputs.version }}" \
            --argjson buildNumber "${{ github.run_number }}" \
            --arg platform "$PLATFORM" \
            --arg fileUrl "${{ steps.metadata.outputs.file_url }}" \
            --arg executableSha "${{ steps.hash.outputs.executable_sha }}" \
            --arg managedSha "${{ steps.hash.outputs.managed_sha }}" \
            --arg packageSha "${{ steps.hash.outputs.package_sha }}" \
            '{
              branch: $branch,
              app: $app,
              version: $version,
              buildNumber: $buildNumber,
              ($platform): $fileUrl,
              ($platform + "ExecutableSha256"): $executableSha,
              ($platform + "ManagedSha256"): $managedSha,
              ($platform + "PackageSha256"): $packageSha
            }' > registration.json

          curl --fail-with-body -X POST \
            "${{ secrets.BRICKVERSE_API_URL }}/api/v3/binaries/register" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.GH_WORKFLOW_SECRET }}" \
            --data-binary @registration.json

      - name: Notify Discord
        if: success() && matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail

          jq -n \
            --arg title "${{ matrix.platform }} ${{ env.BUILD_DISPLAY_NAME }} Released" \
            --arg version "${{ steps.metadata.outputs.version }}" \
            --arg branch "${{ env.RELEASE_CHANNEL }}" \
            --arg build "${{ github.run_number }}" \
            --arg download "${{ steps.metadata.outputs.file_url }}" \
            '{
              embeds: [{
                title: $title,
                description: ("**Version:** `" + $version + "`\n**Branch:** `" + $branch + "`\n**Build:** `" + $build + "`\n**Download:** " + $download),
                color: 5814783
              }]
            }' > discord.json

          curl --fail-with-body -X POST \
            "${{ secrets.DISCORD_WEBHOOK_RELEASES }}" \
            -H "Content-Type: application/json" \
            --data-binary @discord.json

      - name: Upload workflow artifact
        if: matrix.platform != 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ github.workspace }}/dist/${{ matrix.package_name }}
          if-no-files-found: error
          retention-days: 14
